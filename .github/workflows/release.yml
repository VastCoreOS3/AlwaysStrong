on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      override_tag:
        description: "Existing remote git tag (vX.Y.Z). Leave empty for tag‑push trigger"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Compute effective tag
        id: meta
        run: |
          if [[ -n "${{ github.event.inputs.override_tag }}" ]]; then
            echo "tag=${{ github.event.inputs.override_tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zip unzip

      - name: Use committed native binaries
        run: find native -path '*/prebuilt/*' -type f -exec touch {} +

      - name: Build the release zips
        run: bash build.sh

      - name: Checksums for the release
        run: |
          set -eu
          {
            echo "# AlwaysStrong ${{ steps.meta.outputs.tag }} - sha256"
            echo "# Release zips, verify with: sha256sum -c SHA256SUMS.txt"
            ( cd out && sha256sum AlwaysStrong-*.zip )
            echo "#"
            echo "# Native binaries shipped inside those zips, built from"
            echo "# native/asfetch/src and native/watcher/src by native.yml."
            echo "# Reference only - rerun that workflow to reproduce them."
            find native -path '*/prebuilt/*' -type f | sort | xargs sha256sum | sed 's/^/# /'
          } > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release notes from CHANGELOG
        run: |
          awk -v v="## ${{ steps.meta.outputs.tag }}" '
            $0==v {f=1; next}
            /^## / {f=0}
            f {print}
          ' CHANGELOG.md > RELEASE_NOTES.md
          {
            echo
            echo "---"
            echo
            echo "### Verify what you flashed"
            echo
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
            echo
            echo "Every zip here is built from this tag by `.github/workflows/release.yml` on a"
            echo "GitHub runner and is never uploaded by hand. The two native binaries are plain"
            echo "Rust, with full source in `native/asfetch` and `native/watcher`; rerun"
            echo "`.github/workflows/native.yml` to rebuild them and compare the hashes above."
          } >> RELEASE_NOTES.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        # 有手动输入tag OR 当前ref是tag，才执行发布
        if: github.event.inputs.override_tag != '' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: |
            out/AlwaysStrong-*.zip
            SHA256SUMS.txt
          draft: false
          prerelease: false
          fail_on_unmatched_files: true

      - name: Point the update manifests at this release
        continue-on-error: true
        run: |
          set -eu
          tag="${{ steps.meta.outputs.tag }}"
          git fetch --no-tags origin +refs/heads/main:refs/heads/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" main; then
            echo "::notice::tag $tag is not on main — leaving the manifests alone"
            exit 0
          fi
          git checkout main
          ver=$(sed -n 's/^version=//p' module/module.prop)
          code=$(sed -n 's/^versionCode=//p' module/module.prop)
          write_manifest() {
            printf '{\n  "version": "%s",\n  "versionCode": %s,\n  "zipUrl": "https://github.com/%s/releases/download/%s/%s",\n  "changelog": "https://raw.githubusercontent.com/%s/main/CHANGELOG.md"\n}\n' \
              "$ver" "$code" "$GITHUB_REPOSITORY" "$tag" "$2" "$GITHUB_REPOSITORY" > "$1"
          }
          write_manifest update.json        "AlwaysStrong-${ver}.zip"
          write_manifest update-inject.json "AlwaysStrong-${ver}-inject.zip"
          write_manifest update-nopif.json  "AlwaysStrong-${ver}-nopif.zip"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add update.json update-inject.json update-nopif.json
          git diff --cached --quiet && { echo "manifests already current"; exit 0; }
          git commit -m "chore: point update manifests at $tag"
          git push origin main
